name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Beat Saber ${{ matrix.target }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 1.39.1
            dependency-profile: 1.39.1
            artifact-name: BeatLocator-1.39.1
            package-source: BeatLocator/bin/Release/1.39.1/net472/Artifact
          - target: 1.40.2-1.40.8
            dependency-profile: 1.40.2-1.40.8
            artifact-name: BeatLocator-1.40.2-1.40.8
            package-source: BeatLocator/bin/Release/1.40.2-1.40.8/Artifact

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download verified mod dependencies
        shell: powershell
        run: >-
          .\scripts\get-mod-dependencies.ps1
          -Profile '${{ matrix.dependency-profile }}'

      - name: Restore NuGet packages
        shell: powershell
        run: dotnet restore .\BeatLocator.sln

      - name: Build Beat Saber 1.39.1
        if: matrix.target == '1.39.1'
        shell: powershell
        run: >-
          .\scripts\build-version.ps1
          -GameVersion 1.39.1
          -Configuration Release
          -NoRestore
          -DisableZipRelease

      - name: Build Beat Saber 1.40.2-1.40.8
        if: matrix.target == '1.40.2-1.40.8'
        shell: powershell
        run: >-
          .\scripts\build-1.40.2-1.40.8.ps1
          -Configuration Release
          -NoRestore

      - name: Package build artifact
        shell: powershell
        run: |
          $sourceDirectory = Resolve-Path -LiteralPath '${{ matrix.package-source }}'
          $packageDirectory = New-Item -ItemType Directory -Path '.\artifacts\ci' -Force
          $packagePath = Join-Path $packageDirectory '${{ matrix.artifact-name }}.zip'
          $pluginPath = Join-Path $sourceDirectory 'Plugins\BeatLocator.dll'

          if (-not (Test-Path -LiteralPath $pluginPath -PathType Leaf)) {
            throw "Built plugin was not found: $pluginPath"
          }

          Compress-Archive `
            -Path (Join-Path $sourceDirectory 'Plugins') `
            -DestinationPath $packagePath `
            -CompressionLevel Optimal `
            -Force

          if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
            throw "Build package was not created: $packagePath"
          }

          Get-FileHash -LiteralPath $packagePath -Algorithm SHA256

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/ci/${{ matrix.artifact-name }}.zip
          if-no-files-found: error
          retention-days: 14
